services:
  pocketsre-core:
    container_name: pocketsre-core
    build: .
    env_file:
      - path: .env
        required: false  # fall back to .env.example defaults; copy it to .env first
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-only mounts: key + sanitized infra docs never enter the image.
      # `~` is NOT expanded inside ${...} — SSH_KEY_PATH must be absolute.
      - ${SSH_KEY_PATH:-${HOME}/.ssh/pocketsre_bot_ed25519}:/app/.ssh/pocketsre_bot_ed25519:ro
      - ./docs/infra:/app/docs/infra:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    restart: unless-stopped
